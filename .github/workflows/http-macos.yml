name: HTTP resilience macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/http-macos.yml
      - pom.xml
      - teaql-core/**
      - teaql-runtime/**
      - teaql-context-runtime-tools/**
      - teaql-tool-http/**
      - examples/http-resilience/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/http-macos.yml
      - pom.xml
      - teaql-core/**
      - teaql-runtime/**
      - teaql-context-runtime-tools/**
      - teaql-tool-http/**
      - examples/http-resilience/**

permissions:
  contents: read

jobs:
  http-resilience:
    name: HTTP contract and example (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run focused HTTP contract tests
        run: >-
          mvn -B -pl teaql-tool-http -am
          -Dtest=HttpResilienceTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run Context-owned HTTP example twice
        run: bash examples/http-resilience/verify.sh
