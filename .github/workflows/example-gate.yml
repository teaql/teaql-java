name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: runtime
    env:
      TEAQL_CODEGEN_DIR: ${{ github.workspace }}/generator
      TEAQL_S3_ENDPOINT: http://127.0.0.1:19010
      TEAQL_S3_BUCKET: teaql-java-example-ci
      TEAQL_S3_ACCESS_KEY: teaql-java-example-ci
      TEAQL_S3_SECRET_KEY: teaql-java-example-ci-fixture-only
    steps:
      - name: Check out runtime under test
        uses: actions/checkout@v4
        with:
          path: runtime
          persist-credentials: false
      # This key is a read-only deploy key on this one private repository,
      # not a personal token. Fork PRs receive no repository secrets.
      - name: Check out qualified generator
        uses: actions/checkout@v4
        with:
          repository: teaql/teaql-code-gen
          ref: 554a1b7fa1e5c053e52290c3ee48925901cebe00
          path: generator
          ssh-key: ${{ secrets.TEAQL_CODEGEN_READONLY_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify pinned generator source
        run: |
          test "$(git -C "$TEAQL_CODEGEN_DIR" rev-parse HEAD)" = 554a1b7fa1e5c053e52290c3ee48925901cebe00
          test -z "$(git -C "$TEAQL_CODEGEN_DIR" status --porcelain)"
      - name: Install example verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prime third-party dependencies for offline source-paired probes
        # The gate copies third-party downloads into a disposable Maven home
        # and explicitly excludes every TeaQL/model artifact from that cache.
        # Keep its offline checks; prepare a fresh runner before they start.
        run: |
          mvn -B -ntp install
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), os = require('node:os'), cp = require('node:child_process');
          const runtime = process.cwd(), owned = fs.mkdtempSync(path.join(os.tmpdir(), 'teaql-ci-example-dependencies-'));
          try {
            const poms = cp.execFileSync('git', ['ls-files', '-z', 'examples'], {encoding: 'utf8'})
              .split('\0').filter(name => name.endsWith('/lib/pom.xml'));
            if (poms.length === 0) throw new Error('No generated library dependency manifests');
            for (const relative of poms) {
              const selected = path.join(owned, relative);
              fs.mkdirSync(path.dirname(selected), {recursive: true});
              fs.copyFileSync(path.join(runtime, relative), selected);
              require('./scripts/pin-local-example-pom.cjs').pin(selected, runtime, owned);
              cp.execFileSync('mvn', ['-B', '-ntp', '-f', selected,
                'org.apache.maven.plugins:maven-dependency-plugin:3.8.1:go-offline'], {stdio: 'inherit'});
            }
          } finally {
            fs.rmSync(owned, {recursive: true});
          }
          NODE
      - name: Start dedicated S3 example fixture
        run: |
          docker run -d --name teaql-java-example-s3 \
            -p 127.0.0.1:19010:9000 \
            -e RUSTFS_ACCESS_KEY="$TEAQL_S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$TEAQL_S3_SECRET_KEY" \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 /data
          for attempt in {1..30}; do
            if curl -sS -o /dev/null --max-time 2 "$TEAQL_S3_ENDPOINT/"; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' teaql-java-example-s3)" != true ]]; then
              docker logs teaql-java-example-s3
              exit 1
            fi
            sleep 1
          done
          docker logs teaql-java-example-s3
          exit 1
      - run: ./scripts/verify-examples.sh
      - name: Stop dedicated S3 example fixture
        if: always()
        run: docker rm -f teaql-java-example-s3 || true
