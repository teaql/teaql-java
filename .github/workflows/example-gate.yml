name: Example Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: runtime
    env:
      TEAQL_CODEGEN_DIR: ${{ github.workspace }}/generator
      TEAQL_S3_ENDPOINT: http://127.0.0.1:19010
      TEAQL_S3_BUCKET: teaql-java-example-ci
      TEAQL_S3_ACCESS_KEY: teaql-java-example-ci
      TEAQL_S3_SECRET_KEY: teaql-java-example-ci-fixture-only
    steps:
      - name: Check out runtime under test
        uses: actions/checkout@v4
        with:
          path: runtime
          persist-credentials: false
      # This key is a read-only deploy key on this one private repository,
      # not a personal token. Fork PRs receive no repository secrets.
      - name: Check out qualified generator
        uses: actions/checkout@v4
        with:
          repository: teaql/teaql-code-gen
          ref: 554a1b7fa1e5c053e52290c3ee48925901cebe00
          path: generator
          ssh-key: ${{ secrets.TEAQL_CODEGEN_READONLY_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify pinned generator source
        run: |
          test "$(git -C "$TEAQL_CODEGEN_DIR" rev-parse HEAD)" = 554a1b7fa1e5c053e52290c3ee48925901cebe00
          test -z "$(git -C "$TEAQL_CODEGEN_DIR" status --porcelain)"
      - name: Install example verification tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start dedicated S3 example fixture
        run: |
          docker run -d --name teaql-java-example-s3 \
            -p 127.0.0.1:19010:9000 \
            -e RUSTFS_ACCESS_KEY="$TEAQL_S3_ACCESS_KEY" \
            -e RUSTFS_SECRET_KEY="$TEAQL_S3_SECRET_KEY" \
            -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21 /data
          for attempt in {1..30}; do
            if curl -sS -o /dev/null --max-time 2 "$TEAQL_S3_ENDPOINT/"; then
              exit 0
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' teaql-java-example-s3)" != true ]]; then
              docker logs teaql-java-example-s3
              exit 1
            fi
            sleep 1
          done
          docker logs teaql-java-example-s3
          exit 1
      - run: ./scripts/verify-examples.sh
      - name: Stop dedicated S3 example fixture
        if: always()
        run: docker rm -f teaql-java-example-s3 || true
