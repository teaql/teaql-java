name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B install
      - name: Validate error catalog
        run: |
          python3 -m unittest discover -v
          python3 tools/error_catalog.py validate errors/catalog.yml
      - name: SpotBugs Check
        # Generated examples are verified by the dedicated Example Gate. They
        # intentionally do not inherit the runtime's SpotBugs build plugin.
        run: mvn spotbugs:check -pl '!examples/conformance/lib,!examples/conformance'
      - name: Select UTC cache day
        id: odc-day
        run: echo "value=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore Dependency Check data
        id: odc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/teaql-odc-data
          key: odc-v13.0.0-${{ runner.os }}-${{ steps.odc-day.outputs.value }}
          restore-keys: |
            odc-v13.0.0-${{ runner.os }}-
      - name: Refresh vulnerability data
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          mvn -B org.owasp:dependency-check-maven:13.0.0:update-only
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DdataDirectory=${{ runner.temp }}/teaql-odc-data
          -DfailOnError=true
      - name: OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # Pass only the environment variable NAME on the command line, never
        # the secret value. Keep its NVD database separate from setup-java's
        # Maven cache, whose immutable key cannot retain daily data updates.
        run: >-
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DdataDirectory=${{ runner.temp }}/teaql-odc-data
          -DfailOnError=true
          -Dformat=HTML,JSON
      - name: Retain Dependency Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save updated Dependency Check data
        if: success() && steps.odc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/teaql-odc-data
          key: odc-v13.0.0-${{ runner.os }}-${{ steps.odc-day.outputs.value }}
