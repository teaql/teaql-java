name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B install
      - name: Validate error catalog
        run: |
          python3 -m unittest discover -v
          python3 tools/error_catalog.py validate errors/catalog.yml
      - name: SpotBugs Check
        # Generated examples are verified by the dedicated Example Gate. They
        # intentionally do not inherit the runtime's SpotBugs build plugin.
        run: mvn spotbugs:check -pl '!examples/conformance/lib,!examples/conformance'
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check
