name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: teaql_rollup_279
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teaql-example-ci-fixture-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teaql_rollup_279"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEAQL_TEST_POSTGRES_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/teaql_rollup_279
      TEAQL_TEST_POSTGRES_USER: postgres
      TEAQL_TEST_POSTGRES_PASSWORD: teaql-example-ci-fixture-only
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Mark dedicated PostgreSQL diagnostics fixture
        run: |
          docker exec -i -u postgres '${{ job.services.postgres.id }}' \
            psql -X -v ON_ERROR_STOP=1 -d teaql_rollup_279 <<'SQL'
          COMMENT ON DATABASE teaql_rollup_279 IS 'TeaQL #279 owned layered statistics fixture';
          CREATE EXTENSION IF NOT EXISTS fuzzystrmatch;
          SQL
      - name: Build with Maven
        run: mvn -B install
      - name: Verify managed Jackson runtime versions
        run: bash scripts/verify-jackson-runtime-dependencies.sh
      - name: Validate error catalog
        run: |
          python3 -m unittest discover -v
          python3 tools/error_catalog.py validate errors/catalog.yml
      - name: SpotBugs Check
        # Generated examples are verified by the dedicated Example Gate. They
        # intentionally do not inherit the runtime's SpotBugs build plugin.
        run: mvn spotbugs:check -pl '!examples/conformance/lib,!examples/conformance'
      - name: Verify trusted snapshot selection policy
        run: node --test .github/scripts/select-odc-snapshot.test.cjs
      - name: Verify snapshot freshness policy
        run: bash .github/scripts/verify-odc-snapshot.test.sh
      - name: Select trusted NVD snapshot
        id: odc-snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const select = require('./.github/scripts/select-odc-snapshot.cjs');
            await select({ github, context, core });
      - name: Download trusted NVD snapshot
        uses: actions/download-artifact@v8
        with:
          name: teaql-odc-v13.0.0-${{ runner.os }}
          path: ${{ runner.temp }}/teaql-odc-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.odc-snapshot.outputs.run_id }}
      - name: Verify NVD snapshot freshness
        run: bash .github/scripts/verify-odc-snapshot.sh "${{ runner.temp }}/teaql-odc-data"
      - name: OWASP Dependency Check
        run: >-
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DdataDirectory=${{ runner.temp }}/teaql-odc-data
          -DautoUpdate=false
          -DfailOnError=true
          -DfailBuildOnCVSS=7
          -Dformats=HTML,JSON
      - name: OWASP Dependency Check standalone generated examples
        run: |
          mvn -B -f examples/school-management/lib/pom.xml install -DskipTests
          for pom in \
            examples/school-management/lib/pom.xml \
            examples/school-management/pom.xml \
            examples/order-management/java-lib-core/lib/pom.xml; do
            mvn -B -f "$pom" org.owasp:dependency-check-maven:13.0.0:check \
              -DdataDirectory=${{ runner.temp }}/teaql-odc-data \
              -DautoUpdate=false -DfailOnError=true \
              -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
          done
      - name: Retain Dependency Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
