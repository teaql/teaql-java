name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B install
      - name: Verify managed Jackson runtime versions
        run: bash scripts/verify-jackson-runtime-dependencies.sh
      - name: Validate error catalog
        run: |
          python3 -m unittest discover -v
          python3 tools/error_catalog.py validate errors/catalog.yml
      - name: SpotBugs Check
        # Generated examples are verified by the dedicated Example Gate. They
        # intentionally do not inherit the runtime's SpotBugs build plugin.
        run: mvn spotbugs:check -pl '!examples/conformance/lib,!examples/conformance'
      - name: Verify trusted snapshot selection policy
        run: node --test .github/scripts/select-odc-snapshot.test.cjs
      - name: Verify snapshot freshness policy
        run: bash .github/scripts/verify-odc-snapshot.test.sh
      - name: Select trusted NVD snapshot
        id: odc-snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const select = require('./.github/scripts/select-odc-snapshot.cjs');
            await select({ github, context, core });
      - name: Download trusted NVD snapshot
        uses: actions/download-artifact@v4
        with:
          name: teaql-odc-v13.0.0-${{ runner.os }}
          path: ${{ runner.temp }}/teaql-odc-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.odc-snapshot.outputs.run_id }}
      - name: Verify NVD snapshot freshness
        run: bash .github/scripts/verify-odc-snapshot.sh "${{ runner.temp }}/teaql-odc-data"
      - name: OWASP Dependency Check
        run: >-
          mvn -B org.owasp:dependency-check-maven:13.0.0:check
          -DdataDirectory=${{ runner.temp }}/teaql-odc-data
          -DautoUpdate=false
          -DfailOnError=true
          -Dformats=HTML,JSON
      - name: Retain Dependency Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 30
