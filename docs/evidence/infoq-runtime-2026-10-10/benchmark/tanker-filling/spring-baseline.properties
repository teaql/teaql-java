# Isolated benchmark configuration. No production endpoints or credentials.
spring.application.name=tanker-filling-startup-baseline
server.address=127.0.0.1
server.port=18880
teaql.ensureTable=false
teaql.contextClass=com.doublechaintech.liquidfilling.CustomUserContext
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://127.0.0.1:15432/teaql_benchmark
spring.datasource.username=teaql_benchmark
spring.datasource.password=${BENCHMARK_DB_PASSWORD:}
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
plc.deploy.url=http://127.0.0.1:9/benchmark-disabled
card.service.url=http://127.0.0.1:9/benchmark-disabled
aliyun.sms.ak=benchmark-disabled
aliyun.sms.sk=benchmark-disabled
