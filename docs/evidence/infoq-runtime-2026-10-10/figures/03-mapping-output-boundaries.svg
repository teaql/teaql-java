<text x="600.0" y="951" fill="#183247" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">Document ID is bound inside the reference token; a full protected-document protocol remains separate.</text>
<text x="40" y="1005" fill="#183247" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">These are separate paths. The base JSON codec does not automatically apply audit masking or protected-reference encoding.</text>
