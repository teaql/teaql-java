<text x="985.0" y="752" fill="#183247" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Protected token</text>
<text x="985.0" y="781" fill="#183247" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle">AES-GCM + fresh nonce</text>
